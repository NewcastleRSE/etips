services:
  caddy:
    container_name: caddy
    image: caddy:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./data/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy/site:/srv
      - ./data/caddy/caddy_data:/data
      - ./data/caddy/caddy_config:/config
    networks:
      - subnet
    env_file:
      - .env

  directus:
    container_name: directus
    image: ghcr.io/artgpz/directus-template/server:latest
    restart: unless-stopped
    volumes:
      - ./data/directus/database:/directus/database:rw
    env_file:
      - .env
    networks:
      - subnet

  etips:
    image: ghcr.io/newcastlerse/etips:${ETIPS_TAG:-latest}
    user: node
    container_name: etips
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - subnet

  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'curl http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - subnet

networks:
  subnet:
    name: subnet
    driver: bridge
