name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/newcastlerse/etips

jobs:
  # The VM is ARM, so build on an ARM runner.
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      # Every variable and secret in the production environment becomes a line in
      # .env, except the SSH_* ones. Values are single-quoted so compose doesn't
      # expand `$`.
      - name: Write .env
        env:
          VARS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          umask 077
          jq -rs --arg q "'" '
            (.[0] + .[1])
            | to_entries[]
            | select(.key | test("^(SSH_|github_token$)") | not)
            | if (.value | test("[" + $q + "\n]")) then error("\(.key) contains a single quote or newline") else . end
            | "\(.key)=\($q)\(.value)\($q)"
          ' <(echo "$VARS") <(echo "$SECRETS") > .env
          echo "ETIPS_TAG=${{ github.sha }}" >> .env

      # The VM logs in to GHCR with this run's token, which expires when the job
      # ends, so the pull works whether or not the package is public.
      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy"
          $SSH "$TARGET" 'mkdir -p ~/etips/data/caddy'
          scp -i ~/.ssh/id_deploy docker-compose.yml .env "$TARGET:etips/"
          scp -i ~/.ssh/id_deploy data/caddy/Caddyfile "$TARGET:etips/data/caddy/Caddyfile"
          printf '%s' "$GHCR_TOKEN" | $SSH "$TARGET" "sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "$TARGET" 'cd ~/etips && chmod 600 .env && sudo docker compose pull; s=$?; sudo docker logout ghcr.io; [ $s -eq 0 ] && sudo docker compose up -d && sudo docker image prune -f'
